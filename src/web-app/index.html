<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBD-Cortex Interface</title>
    <style>
        :root {
            --bg-primary: #000000;
            --bg-secondary: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --accent: #555555;
            --gradient: linear-gradient(135deg, #000000 0%, #2c2c2c 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Ambient Background Effect */
        .background-fx {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #222222 0%, #000000 70%);
            z-index: -1;
        }

        /* Header */
        header {
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid #333;
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 2px;
            font-size: 1.2rem;
            text-transform: uppercase;
        }

        .status-badge {
            font-size: 0.8rem;
            padding: 4px 8px;
            background: #222;
            border: 1px solid #444;
            border-radius: 4px;
            color: #888;
        }

        /* Chat Container */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .message {
            max-width: 80%;
            padding: 15px;
            border-radius: 12px;
            line-height: 1.5;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: #ffffff;
            color: #000000;
            border-bottom-right-radius: 2px;
        }

        .message.ai {
            align-self: flex-start;
            background: #1a1a1a;
            border: 1px solid #333;
            border-bottom-left-radius: 2px;
        }

        /* Input Area */
        footer {
            padding: 20px;
            background: rgba(0, 0, 0, 0.9);
            border-top: 1px solid #333;
            display: flex;
            justify-content: center;
        }

        .input-wrapper {
            width: 100%;
            max-width: 800px;
            position: relative;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            background: #111;
            border: 1px solid #333;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #666;
            background: #1a1a1a;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
        }

        button {
            background: white;
            color: black;
            border: none;
            padding: 0 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.1s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        /* Loading Indicator */
        .typing-indicator {
            display: none;
            gap: 5px;
            padding: 10px;
            margin-left: 10px;
        }
        
        .dot {
            width: 6px;
            height: 6px;
            background: #666;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

    </style>
</head>
<body>
    <div class="background-fx"></div>
    
    <header>
        <h1>OBD-CORTEX</h1>
        <div class="status-badge">SECURE CONNECTION</div>
    </header>

    <main id="chat-container">
        <div class="message ai">
            Hello. I am OBD-Cortex. I am connected to your vehicle's telemetry stream. How can I assist you today?
        </div>
    </main>

    <div class="typing-indicator" id="loading">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <footer>
        <div class="input-wrapper">
            <input type="text" id="user-input" placeholder="Ask about vehicle status, DTC codes, or maintenance..." autocomplete="off">
            <button id="send-btn">SEND</button>
        </div>
    </footer>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const loading = document.getElementById('loading');

        // Note: For testing, we hardcode the VIN. In the mobile app, this will be dynamic.
        const TEST_VIN = "VIN_12345_TEST";
        
        // This must match the MOBILE_API_KEY in your Python backend
        const API_KEY = "dev_secret_key_123";

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.classList.add('message', sender);
            
            // Basic formatting to support markdown-style text from the new AI prompt
            let formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            formattedText = formattedText.replace(/\n/g, '<br>');
            div.innerHTML = formattedText;
            
            chatContainer.appendChild(div);
            // Auto scroll to bottom
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // UI Updates
            addMessage(text, 'user');
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;
            loading.style.display = 'flex';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-API-Key': API_KEY  // <-- Added required security header
                    },
                    // <-- Added required VIN to the JSON body
                    body: JSON.stringify({ 
                        vin: TEST_VIN, 
                        query: text 
                    })
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const data = await response.json();
                loading.style.display = 'none';
                addMessage(data.response, 'ai');
                
            } catch (error) {
                loading.style.display = 'none';
                addMessage(`Error: ${error.message}. Check terminal for details.`, 'ai');
                console.error('Chat error:', error);
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        // Event Listeners
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

    </script>
</body>
</html>
