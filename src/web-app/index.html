<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBD-Cortex Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #06060b;
            --bg-secondary: #0d0d14;
            --bg-card: rgba(255, 255, 255, 0.03);
            --bg-glass: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.12);
            --text-primary: #e8e8ed;
            --text-secondary: #8a8a9a;
            --text-muted: #55556a;
            --accent-blue: #4f8fff;
            --gradient-hero: linear-gradient(135deg, #4f8fff 0%, #8b5cf6 50%, #d946ef 100%);
            --radius-md: 12px;
            --radius-lg: 16px;
            --font-sans: 'Inter', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-sans);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Floating Orbs */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.15;
            animation: float 25s infinite ease-in-out alternate;
        }
        body::before {
            background: #4f8fff;
            top: -100px;
            left: -100px;
        }
        body::after {
            background: #8b5cf6;
            bottom: -100px;
            right: -100px;
            width: 500px;
            animation-duration: 30s;
        }
        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(100px, 50px); }
        }

        /* Header / Config Bar */
        header {
            padding: 16px 24px;
            background: rgba(13, 13, 20, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-size: 16px;
            font-weight: 700;
            background: var(--gradient-hero);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .config-bar {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .config-bar input {
            background: var(--bg-glass);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 8px;
            font-family: var(--font-mono);
            font-size: 12px;
            outline: none;
            transition: border-color 0.2s;
            width: 200px;
        }
        .config-bar input:focus {
            border-color: var(--accent-blue);
        }

        .config-bar button {
            background: var(--bg-glass);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .config-bar button:hover {
            background: var(--border);
        }

        /* Chat Area */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        
        main::-webkit-scrollbar {
            width: 6px;
        }
        main::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
        }

        .message {
            max-width: 85%;
            padding: 16px;
            border-radius: var(--radius-lg);
            line-height: 1.6;
            font-size: 14px;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: var(--gradient-hero);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        /* Markdown Styles inside AI Message */
        .message.ai strong { font-weight: 600; color: #fff; }
        .message.ai pre {
            background: #000;
            padding: 12px;
            border-radius: 8px;
            margin: 8px 0;
            overflow-x: auto;
            font-family: var(--font-mono);
            font-size: 12px;
            border: 1px solid var(--border);
        }
        .message.ai code {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--accent-blue);
            background: rgba(0,0,0,0.3);
            padding: 2px 4px;
            border-radius: 4px;
        }
        .message.ai pre code {
            background: transparent;
            padding: 0;
            color: var(--text-primary);
        }
        .message.ai ul, .message.ai ol { margin-left: 20px; margin-top: 8px; margin-bottom: 8px; }

        /* Input Area */
        .input-area {
            padding: 20px 24px;
            background: rgba(13, 13, 20, 0.8);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: center;
        }

        .input-container {
            max-width: 800px;
            width: 100%;
            display: flex;
            gap: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 8px;
        }
        .input-container:focus-within {
            border-color: var(--border-hover);
            background: var(--bg-glass);
        }

        input[type="text"]#query {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            padding: 8px 12px;
            font-size: 15px;
            font-family: var(--font-sans);
            outline: none;
        }
        input[type="text"]#query::placeholder { color: var(--text-muted); }

        .send-btn {
            background: var(--gradient-hero);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }
        .send-btn:hover { opacity: 0.9; }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .typing {
            align-self: flex-start;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            display: none;
            gap: 4px;
            align-items: center;
        }
        .dot {
            width: 6px;
            height: 6px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">OBD-CORTEX TEST</div>
        <div class="config-bar">
            <input type="password" id="apiKey" placeholder="Mobile API Key">
            <input type="text" id="vinInput" placeholder="Vehicle VIN">
            <button onclick="clearChat()">Clear Memory</button>
        </div>
    </header>

    <main id="chatArea">
        <div class="message ai">
            Welcome to the OBD-Cortex Simulator. Please enter your API Key and a VIN in the top bar to begin.
        </div>
        <div class="typing" id="typingIndicator">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
    </main>

    <div class="input-area">
        <div class="input-container">
            <input type="text" id="query" placeholder="Ask about diagnostics, DTCs, or repair manuals..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const queryInput = document.getElementById('query');
        const chatArea = document.getElementById('chatArea');
        const typingIndicator = document.getElementById('typingIndicator');
        const sendBtn = document.getElementById('sendBtn');
        const apiKeyInput = document.getElementById('apiKey');
        const vinInput = document.getElementById('vinInput');

        // Load config from localStorage
        window.onload = () => {
            apiKeyInput.value = localStorage.getItem('obd_api_key') || '';
            vinInput.value = localStorage.getItem('obd_test_vin') || 'VIN_12345_TEST';
        };

        // Save config on change
        apiKeyInput.addEventListener('change', () => localStorage.setItem('obd_api_key', apiKeyInput.value));
        vinInput.addEventListener('change', () => localStorage.setItem('obd_test_vin', vinInput.value));

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        // Simple markdown parser
        function parseMarkdown(text) {
            let html = text
                .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>') // code blocks
                .replace(/`([^`]+)`/g, '<code>$1</code>') // inline code
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // bold
                .replace(/\n\n/g, '</p><p>') // paragraphs
                .replace(/\n/g, '<br>'); // line breaks
            
            // Handle lists (basic implementation)
            html = html.replace(/<br>- (.*?)(?=<br>|$)/g, '<li>$1</li>');
            html = html.replace(/(<li>.*?<\/li>)/g, '<ul>$1</ul>');
            html = html.replace(/<\/ul><ul>/g, ''); // merge adjacent lists
            
            return `<p>${html}</p>`;
        }

        function appendMessage(sender, text) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            if (sender === 'ai') {
                div.innerHTML = parseMarkdown(text);
            } else {
                div.textContent = text;
            }
            chatArea.insertBefore(div, typingIndicator);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        async function clearChat() {
            const apiKey = apiKeyInput.value.trim();
            const vin = vinInput.value.trim();
            if (!apiKey || !vin) return alert('Please enter API Key and VIN.');
            
            try {
                const res = await fetch('/api/clear-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-API-Key': apiKey },
                    body: JSON.stringify({ vin: vin })
                });
                if (!res.ok) throw new Error('Failed');
                
                chatArea.innerHTML = '';
                chatArea.appendChild(typingIndicator);
                appendMessage('ai', 'Chat memory cleared.');
            } catch (err) {
                alert('Failed to clear chat memory.');
            }
        }

        async function sendMessage() {
            const text = queryInput.value.trim();
            const apiKey = apiKeyInput.value.trim();
            const vin = vinInput.value.trim();
            
            if (!text) return;
            if (!apiKey) return alert('Please enter your Mobile API Key in the top bar.');
            if (!vin) return alert('Please enter a VIN in the top bar.');

            appendMessage('user', text);
            queryInput.value = '';
            queryInput.disabled = true;
            sendBtn.disabled = true;
            typingIndicator.style.display = 'flex';
            chatArea.scrollTop = chatArea.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': apiKey
                    },
                    body: JSON.stringify({
                        vin: vin,
                        query: text
                    })
                });

                const data = await res.json();
                typingIndicator.style.display = 'none';

                if (!res.ok) {
                    appendMessage('ai', `**Error:** ${data.detail || 'Failed to get response'}`);
                } else {
                    appendMessage('ai', data.response);
                }
            } catch (error) {
                typingIndicator.style.display = 'none';
                appendMessage('ai', `**Connection Error:** Make sure the RAG server is running.`);
            } finally {
                queryInput.disabled = false;
                sendBtn.disabled = false;
                queryInput.focus();
                chatArea.scrollTop = chatArea.scrollHeight;
            }
        }
    </script>
</body>
</html>
