[Journal]
# Cap the maximum disk space used by journald to 500 MB
SystemMaxUse=500M

# Automatically prune entries older than 30 days
MaxRetentionSec=30day

# Compress log data (enabled by default on most systems, but explicit here)
Compress=yes

# Forward to syslog (if installed, e.g., rsyslog)
ForwardToSyslog=yes
