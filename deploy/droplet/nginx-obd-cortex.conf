# ==========================================
# Nginx Reverse Proxy Config -- OBD-Cortex
# ==========================================
# This configuration acts as a secure front door for the FastAPI backend.
# It terminates TLS (using an origin cert) and proxies requests to Uvicorn.

# Rate limiting zone definition (10 req/s per IP)
limit_req_zone $binary_remote_addr zone=obd_limit:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # TLS Certificates (Origin certs for Cloudflare/Proxy)
    ssl_certificate /etc/ssl/obd-cortex/origin.pem;
    ssl_certificate_key /etc/ssl/obd-cortex/origin-key.pem;
    
    # TLS Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    
    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'" always;
    
    # Do not expose Nginx version
    server_tokens off;

    # Maximum allowed request body size (useful for file uploads if any)
    client_max_body_size 10M;

    # Logging
    access_log /var/log/nginx/obd-cortex-access.log;
    error_log /var/log/nginx/obd-cortex-error.log warn;

    location / {
        # Apply rate limiting (burst up to 20, nodelay)
        limit_req zone=obd_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        
        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket Support (for chat if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
