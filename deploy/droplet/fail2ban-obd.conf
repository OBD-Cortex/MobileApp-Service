# ==========================================
# Fail2Ban Configuration -- OBD-Cortex API
# ==========================================
# Drop-in configuration for Fail2Ban to protect the OBD-Cortex FastAPI.
# Place this in /etc/fail2ban/jail.d/obd-cortex.conf
#
# Ensure you also create the corresponding filter definition.

[obd-api-abuse]
enabled = true
port = http,https
filter = obd-api-abuse
logpath = /var/log/nginx/obd-cortex-access.log
# Ban for 1 hour
bantime = 3600
# Lookback window: 5 minutes
findtime = 300
# Trigger ban after 5 failures
maxretry = 5


# ------------------------------------------------------------------------------
# NOTE: You must create the filter definition at:
# /etc/fail2ban/filter.d/obd-api-abuse.conf
# 
# Content for obd-api-abuse.conf:
# 
# [Definition]
# # Match 401 (Unauthorized), 403 (Forbidden), or 429 (Too Many Requests)
# failregex = ^<HOST> -.*"(GET|POST|PUT|DELETE).*HTTP.*" (401|403|429) .*$
# ignoreregex =
# ------------------------------------------------------------------------------
