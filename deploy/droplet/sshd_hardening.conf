# ==========================================
# SSH Hardening Configuration -- OBD-Cortex
# ==========================================
# Drop-in file for /etc/ssh/sshd_config.d/
# IMPORTANT: Create the 'obd' user (or your preferred admin user) and ensure
# you have SSH key access BEFORE applying these settings and restarting sshd!

# Disable root login over SSH
PermitRootLogin no

# Enforce key-based authentication only (disable passwords)
PasswordAuthentication no
PubkeyAuthentication yes

# Limit authentication attempts to mitigate brute-force
MaxAuthTries 3

# Reduce time allowed to complete authentication
LoginGraceTime 30

# Disable unused features
X11Forwarding no
AllowTcpForwarding no

# Enable PAM (Pluggable Authentication Modules)
UsePAM yes

# Do not display a banner
Banner none
